# csirt.pcr.ac.id — Website Profil (apps/website). Lihat docs/ARCHITECTURE.md § 4–5.

# Port 80: hanya ACME challenge (penerbitan/perpanjangan sertifikat) dan redirect ke HTTPS.
server {
    listen 80;
    server_name csirt.pcr.ac.id;

    # HTTP-01 challenge Let's Encrypt — certbot --webroot menulis ke infra/certbot/www
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://csirt.pcr.ac.id$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name csirt.pcr.ac.id;

    ssl_certificate     /etc/letsencrypt/live/csirt.pcr.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csirt.pcr.ac.id/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # HSTS tanpa includeSubDomains — learn.* dan ctf.* belum HTTPS. Dimulai pendek (1 hari);
    # naikkan ke 63072000 (2 tahun, rekomendasi Mozilla) setelah HTTPS terbukti stabil.
    add_header Strict-Transport-Security "max-age=86400" always;

    # Batas body kecil untuk semua endpoint (form kontak, login, update Livewire);
    # hanya endpoint upload yang dilonggarkan — lihat ARCHITECTURE § 4 "Batas ukuran upload".
    client_max_body_size 1m;

    # Resolve saat request lewat DNS internal Docker, bukan saat start (ARCHITECTURE § 2 aturan 4)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_website http://website:8080;   # service `website` di apps/website — port menyesuaikan image yang dipilih

    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $upstream_website;
    }

    # Upload sementara Livewire/Filament. Livewire 4: /livewire-<8 hex dari APP_KEY>/upload-file
    # dan /upload-chunk; Livewire 3: /livewire/upload-file. Regex wajib dikutip karena ada {8}.
    # 13m = batas default Livewire (max:12288 KB) + ruang untuk overhead multipart.
    location ~ "^/livewire(-[0-9a-f]{8})?/upload-(file|chunk)$" {
        client_max_body_size 13m;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $upstream_website;
    }
}
