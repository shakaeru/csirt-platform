# csirt.pcr.ac.id — Website Profil (apps/website).
# Tahap HTTP saja; blok TLS (listen 443 + redirect 80→443) menyusul setelah
# sertifikat terbit via certbot --webroot — lihat docs/ARCHITECTURE.md § 4–5.
server {
    listen 80;
    server_name csirt.pcr.ac.id;

    client_max_body_size 20M;   # upload foto galeri/berita lewat panel Filament

    # HTTP-01 challenge Let's Encrypt — certbot --webroot menulis ke infra/certbot/www
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Resolve saat request lewat DNS internal Docker, bukan saat start (ARCHITECTURE § 2 aturan 4)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_website http://website:8080;   # service `website` di apps/website — port menyesuaikan image yang dipilih

    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $upstream_website;
    }
}
