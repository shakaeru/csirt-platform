# Default server: tolak request dengan Host yang tidak dikenal — akses lewat IP
# langsung, atau subdomain yang DNS-nya sudah aktif tapi config-nya belum ada.
# 444 = Nginx menutup koneksi tanpa mengirim respons.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# HTTPS: tolak handshake TLS untuk nama (SNI) yang tidak dikenal tanpa perlu sertifikat —
# sertifikat csirt.pcr.ac.id tidak ikut terkirim ke pemindai yang mengakses lewat IP.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
