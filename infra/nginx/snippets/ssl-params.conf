# Parameter TLS bersama untuk server block 443 di conf.d/*.conf.
# Profil "intermediate" Mozilla Server Side TLS v6.0 (TLS 1.2 + 1.3).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;   # X25519MLKEM768 = hybrid post-quantum, butuh OpenSSL >= 3.5
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# OCSP stapling sengaja TIDAK diaktifkan (berbeda dari profil Mozilla): Let's Encrypt
# menghentikan OCSP pada 2025, sertifikatnya tidak lagi memuat URL OCSP.
