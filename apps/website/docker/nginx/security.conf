# Menggantikan /etc/nginx/server-opts.d/security.conf bawaan serversideup/php (v4.5.1).
# Sama dengan aslinya KECUALI tanpa Strict-Transport-Security: bawaan image mengirim
# "max-age=31536000; includeSubDomains", yang akan lolos lewat Nginx edge dan mengunci
# learn.* / ctf.* ke HTTPS selama setahun sebelum keduanya punya sertifikat.
# HSTS diatur SATU tempat saja: infra/nginx/conf.d/website.conf (ARCHITECTURE § 5).

# https://owasp.org/www-project-secure-headers/
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

# Tolak dotfile (kecuali /.well-known/, RFC 8615) dan file yang bisa membocorkan isi (H5BP).
location ~ /\.(?!well-known) {
    deny all;
}

location ~* (?:#.*#|\.(?:bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$ {
    deny all;
}
