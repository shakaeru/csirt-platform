# Menggantikan /etc/nginx/server-opts.d/remoteip.conf bawaan serversideup/php (v4.5.1) — sengaja KOSONG.
# Bawaan image mempercayai header CF-Connecting-IP dari range IP Docker. Nginx edge meneruskan
# header itu dari klien apa adanya, jadi pengunjung bisa memalsukan IP-nya. Di sini $remote_addr
# tetap IP Nginx edge; IP asli pengunjung dibaca Laravel dari X-Forwarded-For lewat trustProxies()
# di bootstrap/app.php (log akses container juga mencatat $http_x_forwarded_for).
